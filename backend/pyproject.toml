[project]
name = "household-budget-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "boto3>=1.34.0",
  "mangum>=0.17.0",
  "pydantic-settings>=2.4.0",
  "email-validator>=2.2.0",
  "itsdangerous>=2.2.0",
  "passlib>=1.7.4",
  "python-multipart>=0.0.9",
  "tzdata>=2024.1"
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"
